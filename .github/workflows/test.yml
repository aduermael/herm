name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Run tests (root module)
        run: go test ./...

      - name: Run tests (tools modules)
        env:
          GOWORK: "off"
        run: |
          for mod in tools/*/go.mod; do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done

  cpsl-linux:
    name: CPSL Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.herm-cpsl/cargo-target
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .herm-cpsl/cargo-target
          key: cpsl-linux-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'external/cpsl/Cargo.lock') }}

      - name: Apply Herm CPSL integration patches
        run: scripts/apply-cpsl-patches.sh external/cpsl

      - name: Test native HTTP policy
        run: cargo test --manifest-path external/cpsl/Cargo.toml --locked -p native-http --lib

      - name: Test CPSL FFI
        run: cargo test --manifest-path external/cpsl/Cargo.toml --locked -p cpsl-ffi

      - name: Build and probe the Herm CPSL image
        run: RUN_PROBE=1 scripts/build-cpsl-image.sh --minimum

  cpsl-macos:
    name: CPSL macOS XCFramework
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_PLATFORMS: macos
      CONFIGURATION: Debug
      CPSL_TARGET_DIR: ${{ github.workspace }}/.herm-cpsl/cargo-target
      IOS_DEVICE_TARGETS: ""
      IOS_SIMULATOR_TARGETS: ""
      MACOS_TARGETS: aarch64-apple-darwin
      OUT_DIR: ${{ github.workspace }}/.herm-cpsl/ci-apple
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(awk -F '"' '/^channel = / { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add aarch64-apple-darwin --toolchain "$toolchain"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            .herm-cpsl/cargo-target
          key: cpsl-macos-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'external/cpsl/Cargo.lock') }}

      - name: Build one macOS XCFramework slice
        run: scripts/build-cpsl-apple-xcframework.sh --apple-app

      - name: Verify XCFramework and PDFium outputs
        run: |
          test -f "$OUT_DIR/cpsl.xcframework/Info.plist"
          test -f "$OUT_DIR/libs/pdfium/macos/lib/libpdfium.dylib"
