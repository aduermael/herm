name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  redispatch-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Redispatch tagged deployment from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH"

  deploy:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve released version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            git fetch --force --tags origin
            VERSION="$(git tag --list 'v*' --sort=-version:refname | sed -n '1p')"
            if [[ -z "$VERSION" ]]; then
              VERSION="latest"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved website version: $VERSION"

      - name: Stage website assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Root install.sh is the source of truth; always publish it on Pages so
          # https://hermagent.com/install.sh stays in sync with the repo root.
          if [[ ! -f install.sh ]]; then
            echo "error: install.sh missing at repository root" >&2
            exit 1
          fi
          cp -f install.sh docs/install.sh
          chmod +x docs/install.sh
          sed -i "s|__VERSION__|$VERSION|g" docs/index.html
          # Sanity-check the published installer is present in the site tree.
          test -x docs/install.sh
          head -n 1 docs/install.sh | grep -q '^#!'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
